[project]
name = "foodie"
version = "0.1.0"
description = "Discord bot that estimates calories from food photos with claude -p and logs them to Excel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.7.1",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
foodie = "foodie:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
